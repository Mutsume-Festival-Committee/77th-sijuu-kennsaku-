<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学祭出店 検索システム</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; color: #333; }
    h1 { text-align: center; font-size: 24px; margin-bottom: 20px; }
    input { width: 100%; padding: 12px; font-size: 16px; box-sizing: border-box; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 6px; }
    .card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px; margin-bottom: 12px; background: #fafafa; }
    .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .badge { background: #007bff; color: white; padding: 4px 8px; border-radius: 4px; font-size: 14px; font-weight: bold; }
    .title { font-size: 18px; font-weight: bold; }
    .content { font-size: 14px; color: #555; white-space: pre-wrap; margin: 0; }
    #loading { text-align: center; color: #666; margin-top: 20px; }
  </style>
</head>
<body>

  <h1>学祭出店 検索システム</h1>
  <input type="text" id="searchInput" placeholder="団体名や内容で検索..." oninput="filterData()">
  <div id="result"><p id="loading">データを読み込み中...</p></div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzBZQntuUtbhoNsqMmZmhgBxRSKbEh0bqKt2ahG1Ny7CoIR-RbcZIjJRxyPXPC3mz0V/exec";
    
    let allData = [];

    // GASからデータを取得する関数
    async function fetchData() {
      try {
        const response = await fetch(GAS_API_URL);
        allData = await response.json();
        renderData(allData);
      } catch (error) {
        document.getElementById('result').innerHTML = '<p style="color:red; text-align:center;">データの取得に失敗しました。</p>';
        console.error(error);
      }
    }

    // 画面にカード形式で表示する関数
    function renderData(data) {
      const container = document.getElementById('result');
      if (data.length === 0) {
        container.innerHTML = '<p style="text-align:center;">該当する出店が見つかりません。</p>';
        return;
      }
      
      container.innerHTML = data.map(item => `
        <div class="card">
          <div class="card-header">
            ${item.番号 ? `<span class="badge">No.${item.番号}</span>` : ''}
            <span class="title">${item.団体名 || '名称なし'}</span>
          </div>
          <p class="content">${item.内容 || ''}</p>
        </div>
      `).join('');
    }

    // 入力された文字でリアルタイム検索する関数
    function filterData() {
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allData.filter(item => {
        const name = String(item.団体名 || '').toLowerCase();
        const content = String(item.内容 || '').toLowerCase();
        const number = String(item.番号 || '').toLowerCase();
        return name.includes(keyword) || content.includes(keyword) || number.includes(keyword);
      });
      renderData(filtered);
    }

    // ページ読み込み時に実行
    fetchData();
  </script>
</body>
</html>
