<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>検索アプリ</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    input { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; margin-bottom: 20px; }
    .item { border-bottom: 1px solid #ddd; padding: 10px 0; }
  </style>
</head>
<body>

  <h1>データ検索</h1>
  <input type="text" id="searchInput" placeholder="キーワードを入力..." oninput="filterData()">
  <div id="result">データを読み込み中...</div>

  <script>
    // ★ここに作成したGASのWeb APIのURLを貼る
    const GAS_API_URL = "https://script.google.com/macros/s/YOUR_GAS_DEPLOY_ID/exec";
    
    let allData = [];

    // GASからデータを取得する関数
    async function fetchData() {
      try {
        const response = await fetch(GAS_API_URL);
        allData = await response.json();
        renderData(allData);
      } catch (error) {
        document.getElementById('result').innerText = 'データの取得に失敗しました。';
        console.error(error);
      }
    }

    // 画面に一覧を表示する関数
    function renderData(data) {
      const container = document.getElementById('result');
      if (data.length === 0) {
        container.innerHTML = '<p>該当するデータが見つかりません。</p>';
        return;
      }
      // スプレッドシートの列名に合わせて表示を調整します
      container.innerHTML = data.map(item => `
        <div class="item">
          <strong>${item.タイトル || item.名前 || Object.values(item)[0]}</strong>
          <p>${item.説明 || item.詳細 || ''}</p>
        </div>
      `).join('');
    }

    // 入力された文字でリアルタイム検索する関数
    function filterData() {
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allData.filter(item => {
        return Object.values(item).some(val => 
          String(val).toLowerCase().includes(keyword)
        );
      });
      renderData(filtered);
    }

    // ページが開いた時に実行
    fetchData();
  </script>
</body>
</html>
